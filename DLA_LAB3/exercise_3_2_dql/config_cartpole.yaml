environment:
  name: CartPole-v1
  max_steps: 500

training:
  seeds:
    - 42
    - 123
    - 314
    - 2024
    - 9001
  num_episodes: 1000
  gamma: 0.99
  learning_rate: 0.00075
  hidden_dim: 128
  batch_size: 64
  replay_capacity: 20000
  min_replay_size: 1000
  train_every_steps: 1
  gradient_steps: 4
  vectorized: true
  num_envs: 8
  vector_env_type: sync
  target_update_every_steps: 500
  epsilon_start: 1.0
  epsilon_end: 0.02
  epsilon_decay_steps: 8000
  gradient_clip: 10.0
  force_cpu: true

evaluation:
  num_episodes: 10
  eval_every_n: 20
  eval_episodes_m: 10
